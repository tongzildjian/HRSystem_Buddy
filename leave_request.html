<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มยื่นใบลางาน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leave-request-container">
        <h2>แบบฟอร์มยื่นใบลางาน</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="employeeId">รหัสพนักงาน</label>
                <input type="text" id="employeeId" name="employeeId" required>
            </div>
            <div class="form-group">
                <label for="fullName">ชื่อ-นามสกุล</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="department">แผนก</label>
                <input type="text" id="department" name="department" required>
            </div>
            <div class="form-group">
                <label for="leaveType">ประเภทการลา</label>
                <select id="leaveType" name="leaveType" required>
                    <option value="">--- เลือกประเภทการลา ---</option>
                    <option value="ลาป่วย">ลาป่วย</option>
                    <option value="ลากิจ">ลากิจ</option>
                    <option value="ลาพักร้อน">ลาพักร้อน</option>
                    <!-- สามารถเพิ่มประเภทการลาอื่นๆ ได้ที่นี่ -->
                </select>
            </div>
            <div class="form-group">
                <label for="startDate">วันที่เริ่มลา</label>
                <input type="date" id="startDate" name="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">วันที่สิ้นสุดการลา</label>
                <input type="date" id="endDate" name="endDate" required>
            </div>
            <div class="form-group">
                <label for="reason">เหตุผลในการลา</label>
                <textarea id="reason" name="reason" rows="4" required></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="cancel-button">ยกเลิก</button>
                <button type="submit" class="submit-button">ยื่นใบลางาน</button>
            </div>
        </form>
    </div>
</body>
</html>
